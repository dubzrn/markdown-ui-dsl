# Builds the GitHub Wiki from docs/ and pushes it to <repo>.wiki.git.
# Per GitHub's wiki docs: the wiki is a separate Git repository, only its default branch is live, and it does not exist until
# a first page has been created once (Wiki tab → "Create the first page"). Until then the deploy step stops with instructions.
# Pushing with GITHUB_TOKEN needs `contents: write`. Direct edits on the wiki are overwritten by the next deploy.
# Only `main` ever deploys: pull requests build and check (so a broken page or image is caught before merge), and a manual
# run from any other branch is a dry run, so a feature branch can never overwrite the published wiki.
name: Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/**" # includes docs/img/wiki-banner.png
      - "examples/**"
      - "CONTRIBUTING.md"
      - "scripts/build-wiki.mjs"
      - "packages/embed/**"
      - "packages/core/**"
      - ".github/workflows/wiki.yml"
  pull_request:
    paths:
      - "docs/**" # includes docs/img/wiki-banner.png
      - "examples/**"
      - "CONTRIBUTING.md"
      - "scripts/build-wiki.mjs"
      - "packages/embed/**"
      - "packages/core/**"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only; do not push to the wiki"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('wiki-pr-{0}', github.ref) || 'wiki-deploy' }}
  cancel-in-progress: false

jobs:
  wiki:
    name: build and deploy wiki
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push to the .wiki.git repository
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Check links, anchors and image formats
        run: node scripts/build-wiki.mjs --check

      - name: Build pages and rasterise images (ubuntu-latest ships Google Chrome)
        env:
          WIKI_CHROMIUM: /usr/bin/google-chrome
        run: node scripts/build-wiki.mjs --out wiki-out

      - name: Clone the wiki repository
        id: clone
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          host="${SERVER#https://}"
          if git clone "https://x-access-token:${GH_TOKEN}@${host}/${REPO}.wiki.git" wiki-repo 2>clone.err; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sed "s/${GH_TOKEN}/***/g" clone.err >&2
          has_wiki="$(gh api "repos/${REPO}" --jq .has_wiki 2>/dev/null || echo unknown)"
          if [ "$has_wiki" = "false" ]; then
            step="Wikis is switched off: Settings → Features → tick Wikis, then create the first page."
          else
            step="Open the Wiki tab and click 'Create the first page' (save anything). GitHub creates ${REPO}.wiki.git only then."
          fi
          {
            echo "### Wiki not deployed yet"
            echo
            echo "${REPO}.wiki.git does not exist, and a workflow cannot create it."
            echo
            echo "1. ${step}"
            echo "2. Re-run this workflow (Actions → Wiki → Run workflow)."
            echo
            echo "The build and link checks above passed, so the pages are ready to push."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "ready=false" >> "$GITHUB_OUTPUT"
          if [ "$MANUAL" = "true" ]; then
            echo "::error title=Wiki repository not found::${step} Then re-run this workflow."
            exit 1
          fi
          echo "::warning title=Wiki not deployed::${step} The next run deploys it."

      - name: Sync and push
        if: steps.clone.outputs.ready == 'true'
        env:
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          cd wiki-repo
          git ls-files -z | xargs -0 -r git rm -q --
          cp -R ../wiki-out/. .
          rm -f .mdui-wiki-out # build marker, not wiki content
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Sync wiki from ${SHA::7}" -m "Generated by scripts/build-wiki.mjs from docs/ at ${SHA}. Triggered by ${ACTOR}."
          git push origin HEAD
