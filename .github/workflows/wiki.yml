# Builds the GitHub Wiki from docs/ and pushes it to <repo>.wiki.git.
# Per GitHub's wiki docs: the wiki is a separate Git repository, only its default branch is live, and it does not exist until
# a first page has been created once (Wiki tab → "Create the first page"). Until then the deploy step stops with instructions.
# Pushing with GITHUB_TOKEN needs `contents: write`. Direct edits on the wiki are overwritten by the next deploy.
name: Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "examples/**"
      - "CONTRIBUTING.md"
      - "scripts/build-wiki.mjs"
      - "packages/embed/**"
      - "packages/core/**"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only; do not push to the wiki"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  wiki:
    name: build and deploy wiki
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push to the .wiki.git repository
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Check links, anchors and image formats
        run: node scripts/build-wiki.mjs --check

      - name: Build pages and rasterise images (ubuntu-latest ships Google Chrome)
        env:
          WIKI_CHROMIUM: /usr/bin/google-chrome
        run: node scripts/build-wiki.mjs --out wiki-out

      - name: Clone the wiki repository
        id: clone
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          set -e
          host="${SERVER#https://}"
          if ! git clone "https://x-access-token:${GH_TOKEN}@${host}/${REPO}.wiki.git" wiki-repo 2>clone.err; then
            cat clone.err | sed "s/${GH_TOKEN}/***/g" >&2
            echo "::error title=Wiki repository not found::Enable Wikis (Settings → Features) and create the first page once in the Wiki tab; GitHub only creates ${REPO}.wiki.git then. Re-run this workflow afterwards."
            exit 1
          fi

      - name: Sync and push
        if: steps.clone.outcome == 'success'
        env:
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          cd wiki-repo
          git ls-files -z | xargs -0 -r git rm -q --
          cp -R ../wiki-out/. .
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Sync wiki from ${SHA::7}" -m "Generated by scripts/build-wiki.mjs from docs/ at ${SHA}. Triggered by ${ACTOR}."
          git push origin HEAD
