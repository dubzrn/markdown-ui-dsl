<main class="mdui mdui-style-none" data-theme="auto">
<div class="mdui-col">
<div class="mdui-row">
<p><span class="mdui-img" role="img" aria-label="User Avatar (Rounded, Large)">User Avatar (Rounded, Large)</span></p>
<div class="mdui-col">
<h2>Jane Doe</h2>
<p><span class="mdui-badge">Pro Member</span></p>
<p>Senior Product Designer at Acme Corp.</p>
</div>
<p><button type="button" data-action="edit">Edit Profile</button></p>
</div>
<hr>
<div class="mdui-tabs" role="tablist"><button type="button" role="tab" aria-selected="true">Personal Info</button><button type="button" role="tab" aria-selected="false" tabindex="-1">Security</button><button type="button" role="tab" aria-selected="false" tabindex="-1">Notifications</button></div>
<div class="mdui-col">
<section class="mdui-card">
<h3>Account Details</h3>
<p><input type="text" placeholder="Full Name" aria-label="Full Name"></p>
<p><input type="text" placeholder="Email Address" aria-label="Email Address"></p>
<p><select aria-label="Role"><option selected>Role</option><option>Admin</option><option>Editor</option><option>Viewer</option></select></p>
<h3>Preferences</h3>
<p><button type="button" role="switch" aria-checked="true" aria-label="Two-Factor Authentication">Two-Factor Authentication: on</button></p>
<p><select aria-label="App Theme"><option selected>App Theme</option><option>Light</option><option>Dark</option><option>System</option></select></p>
<p><button type="button" data-action="save">Save Changes</button></p>
</section>
<h3>Recent Activity</h3>
<ul>
<li>
<section class="mdui-card">
<p><strong>Logged in from New Device</strong></p>
<p><button type="button" data-action="details">View Details</button></p>
</section></li>
<li>
<section class="mdui-card">
<p><strong>Updated Subscription Plan</strong></p>
<p><button type="button" data-action="receipt">View Receipt</button></p>
</section></li>
</ul>
</div>
</div>
</main>
